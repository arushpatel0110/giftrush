<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Gift Rush - A festive Christmas slot game with 5 paylines, bonus game, and Buy Bonus feature." />
  <title>Gift Rush – BGaming Slot Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preload" href="./fonts/Magnolia-Script.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Lobster&family=Outfit:wght@400;600;700;900&display=swap"
    rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Magnolia Script';
      src: url('./fonts/Magnolia-Script.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Magnolia-Script';
      src: url('./fonts/Magnolia-Script.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #0a0010;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      transition: background-image 0.4s ease-in-out;
    }

    @media (orientation: landscape) {
      body {
        background-image: url('./assets/bglandscape.png');
      }
    }

    @media (orientation: portrait) {
      body {
        background-image: url('./assets/bgportrait.png');
      }
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    /* Pure Black Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3vh 1rem;
      z-index: 999;
      transition: opacity 0.6s ease;
      box-sizing: border-box;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loader-logo-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
    }

    #loader-logo-img {
      max-width: 620px;
      max-height: 50vh;
      width: 80vw;
      object-fit: contain;
    }

    /* BGAMING Reel Container */
    #bgaming-reel-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.18rem, 1.1vw, 0.65rem);
      margin-bottom: 3vh;
      max-width: 100vw;
      box-sizing: border-box;
      padding: 0 0.25rem;
      flex-wrap: nowrap;
    }

    .reel-box {
      position: relative;
      width: clamp(30px, 8.5vw, 52px);
      height: clamp(30px, 8.5vw, 52px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      overflow: hidden;
      flex-shrink: 0;
    }

    .reel-box.b-box {
      background: transparent;
    }

    .spin-gif {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .letter-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .hidden-item {
      display: none !important;
    }

    .reel-split {
      height: clamp(22px, 6.5vw, 42px);
      width: clamp(2px, 0.5vw, 3px);
      object-fit: contain;
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <!-- Center Logo -->
    <div id="loader-logo-wrap">
      <img src="./assets/loader/logo.jpg" alt="Gift Rush" id="loader-logo-img" />
    </div>

    <!-- Bottom BGAMING Animated Slot Reel Bar -->
    <div id="bgaming-reel-wrap">
      <!-- B Slot (Static) -->
      <div class="reel-box b-box" id="reel-slot-1">
        <img src="./assets/loader/b.png" class="letter-img" alt="B" />
      </div>
      <img src="./assets/loader/split.png" class="reel-split" alt="" />

      <!-- G Slot -->
      <div class="reel-box" id="reel-slot-2">
        <img src="./assets/loader/spin2.gif" class="spin-gif" alt="" />
        <img src="./assets/loader/g.png" class="letter-img hidden-item" alt="G" />
      </div>
      <img src="./assets/loader/split.png" class="reel-split" alt="" />

      <!-- A Slot -->
      <div class="reel-box" id="reel-slot-3">
        <img src="./assets/loader/spin3.gif" class="spin-gif" alt="" />
        <img src="./assets/loader/a.png" class="letter-img hidden-item" alt="A" />
      </div>
      <img src="./assets/loader/split.png" class="reel-split" alt="" />

      <!-- M Slot -->
      <div class="reel-box" id="reel-slot-4">
        <img src="./assets/loader/spin.gif" class="spin-gif" alt="" />
        <img src="./assets/loader/m.png" class="letter-img hidden-item" alt="M" />
      </div>
      <img src="./assets/loader/split.png" class="reel-split" alt="" />

      <!-- I Slot -->
      <div class="reel-box" id="reel-slot-5">
        <img src="./assets/loader/spin2.gif" class="spin-gif" alt="" />
        <img src="./assets/loader/i.png" class="letter-img hidden-item" alt="I" />
      </div>
      <img src="./assets/loader/split.png" class="reel-split" alt="" />

      <!-- N Slot -->
      <div class="reel-box" id="reel-slot-6">
        <img src="./assets/loader/spin3.gif" class="spin-gif" alt="" />
        <img src="./assets/loader/n.png" class="letter-img hidden-item" alt="N" />
      </div>
      <img src="./assets/loader/split.png" class="reel-split" alt="" />

      <!-- G Slot -->
      <div class="reel-box" id="reel-slot-7">
        <img src="./assets/loader/spin.gif" class="spin-gif" alt="" />
        <img src="./assets/loader/g.png" class="letter-img hidden-item" alt="G" />
      </div>
    </div>
  </div>

  <!-- Game Canvas Container -->
  <div id="game-container"></div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
